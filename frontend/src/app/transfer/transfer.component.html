<section>
  <h1>Same-custodian transfer</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>From account <input formControlName="fromAccount"></label>
    <label>To account <input formControlName="toAccount"></label>
    <label>Symbol <input formControlName="symbol" placeholder="AAPL"></label>
    <label>Quantity <input type="number" formControlName="quantity"></label>
    <label>Lot relief
      <select formControlName="method">
        @for (m of methods; track m) {
          <option [value]="m">{{ m }}</option>
        }
      </select>
    </label>
    <button type="submit" [disabled]="submitting">Submit transfer</button>
  </form>
  @if (error) {
    <p class="error">{{ error }}</p>
  }
  @if (result) {
    <div class="result">
      <strong>{{ result.transferId }}</strong> — moved {{ result.quantity }} {{ result.symbol }}
      ({{ result.lotsMoved }} lots, {{ result.costBasisMoved | money }} cost basis)
      from {{ result.fromAccount }} to {{ result.toAccount }}.
    </div>
  }
</section>
